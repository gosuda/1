<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 14px; }
      .step-card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .num-circle { fill: #0284c7; }
      .num-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .step-desc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #cbd5e1; }
      .step-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #94a3b8; }
      .connector { stroke: #475569; stroke-width: 2; }
    </style>
    <marker id="down-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="390" />

  <!-- Step 1 -->
  <g transform="translate(30, 18)">
    <rect class="step-card" x="0" y="0" width="860" height="56" />
    <circle class="num-circle" cx="30" cy="28" r="14" />
    <text class="num-text" x="30" y="33">1</text>
    <text class="step-title" x="58" y="24">Concurrency Control</text>
    <text class="step-desc" x="260" y="24">Private Concurrency Control (PCC) &amp; Intent Locks</text>
    <text class="step-sub" x="260" y="43">Early conflict detection, wound-wait deadlock avoidance, and serializable snapshot pins</text>
  </g>
  <line class="connector" x1="60" y1="74" x2="60" y2="88" marker-end="url(#down-arrow)" />

  <!-- Step 2 -->
  <g transform="translate(30, 90)">
    <rect class="step-card" x="0" y="0" width="860" height="56" />
    <circle class="num-circle" cx="30" cy="28" r="14" />
    <text class="num-text" x="30" y="33">2</text>
    <text class="step-title" x="58" y="24">Timestamp Allocation</text>
    <text class="step-desc" x="260" y="24">Certified Monotonic Clock (clock.Clock / GSTime)</text>
    <text class="step-sub" x="260" y="43">Assigns strictly monotonic linearizable commit timestamp above uncertainty bound</text>
  </g>
  <line class="connector" x1="60" y1="146" x2="60" y2="160" marker-end="url(#down-arrow)" />

  <!-- Step 3 -->
  <g transform="translate(30, 162)">
    <rect class="step-card" x="0" y="0" width="860" height="56" />
    <circle class="num-circle" cx="30" cy="28" r="14" />
    <text class="num-text" x="30" y="33">3</text>
    <text class="step-title" x="58" y="24">Redo WAL Append</text>
    <text class="step-desc" x="260" y="24">Immutable Commit Segment (commits/&lt;pos&gt;.wal)</text>
    <text class="step-sub" x="260" y="43">IEEE CRC32 checksummed redo records; No-Steal policy keeps uncommitted rows out of SSTs</text>
  </g>
  <line class="connector" x1="60" y1="218" x2="60" y2="232" marker-end="url(#down-arrow)" />

  <!-- Step 4 -->
  <g transform="translate(30, 234)">
    <rect class="step-card" x="0" y="0" width="860" height="56" />
    <circle class="num-circle" cx="30" cy="28" r="14" />
    <text class="num-text" x="30" y="33">4</text>
    <text class="step-title" x="58" y="24">Transaction Overlay</text>
    <text class="step-desc" x="260" y="24">In-Memory OverlayView &amp; Private MutationBatch</text>
    <text class="step-sub" x="260" y="43">Direct vector sharing between uncommitted transaction writes and session portals</text>
  </g>
  <line class="connector" x1="60" y1="290" x2="60" y2="304" marker-end="url(#down-arrow)" />

  <!-- Step 5 -->
  <g transform="translate(30, 306)">
    <rect class="step-card" x="0" y="0" width="860" height="56" />
    <circle class="num-circle" cx="30" cy="28" r="14" />
    <text class="num-text" x="30" y="33">5</text>
    <text class="step-title" x="58" y="24">Publication Barrier</text>
    <text class="step-desc" x="260" y="24">Atomic Manifest Advance &amp; ReadFence Issuance</text>
    <text class="step-sub" x="260" y="43">Publishes new SST run generation and advances ClosedTS frontier for readers</text>
  </g>
</svg>
