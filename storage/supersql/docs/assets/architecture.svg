<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 14px; }
      .layer-card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10px; }
      .layer-accent-1 { fill: #38bdf8; }
      .layer-accent-2 { fill: #818cf8; }
      .layer-accent-3 { fill: #34d399; }
      .layer-accent-4 { fill: #f59e0b; }
      .pill { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.3px; }
      .item { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .edge-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #94a3b8; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="620" />

  <!-- Layer 1: Application / SQL Layer -->
  <g transform="translate(30, 24)">
    <rect class="layer-card" x="0" y="0" width="860" height="108" />
    <rect class="layer-accent-1" x="0" y="0" width="6" height="108" rx="3" />
    <text class="title" x="24" y="28">Application &amp; SQL Layer</text>

    <rect class="pill" x="24" y="40" width="395" height="26" />
    <text class="item" x="36" y="57">database/sql via OpenConnector</text>

    <rect class="pill" x="435" y="40" width="400" height="26" />
    <text class="item" x="447" y="57">Cleanroom pgx/v5 Pool, Conn, Tx &amp; Batch API</text>

    <rect class="pill" x="24" y="72" width="395" height="26" />
    <text class="item" x="36" y="89">PostgreSQL 18.4 SQL (DDL, DML, CTE, Window, RLS)</text>

    <rect class="pill" x="435" y="72" width="400" height="26" />
    <text class="item" x="447" y="89">PL/pgSQL Procedural Engine &amp; Custom Session GUC</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line class="arrow" x1="460" y1="132" x2="460" y2="164" marker-end="url(#arrowhead)" />
  <text class="edge-label" x="474" y="153">SQL AST (Pure-Go zpgparse)</text>

  <!-- Layer 2: Query Optimization & Relational Engine -->
  <g transform="translate(30, 168)">
    <rect class="layer-card" x="0" y="0" width="860" height="122" />
    <rect class="layer-accent-2" x="0" y="0" width="6" height="122" rx="3" />
    <text class="title" x="24" y="28">Query Optimization &amp; Relational Engine</text>

    <rect class="pill" x="24" y="38" width="395" height="24" />
    <text class="item" x="36" y="54">AST Name &amp; Type Binding (internal/query/bind)</text>

    <rect class="pill" x="435" y="38" width="400" height="24" />
    <text class="item" x="447" y="54">Cascades Memo Cost-Based Optimizer (query/opt)</text>

    <rect class="pill" x="24" y="66" width="395" height="24" />
    <text class="item" x="36" y="82">Predicate &amp; Projection Pushdown Rules</text>

    <rect class="pill" x="435" y="66" width="400" height="24" />
    <text class="item" x="447" y="82">Zone Map &amp; Timestamp Pruning Extraction</text>

    <rect class="pill" x="24" y="94" width="395" height="22" />
    <text class="item" x="36" y="109">Vectorized Hash Join &amp; Aggregators (query/exec)</text>

    <rect class="pill" x="435" y="94" width="400" height="22" />
    <text class="item" x="447" y="109">Streaming Portal Execution Engine</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line class="arrow" x1="460" y1="290" x2="460" y2="322" marker-end="url(#arrowhead)" />
  <text class="edge-label" x="474" y="311">PushdownPlan / BatchCursor</text>

  <!-- Layer 3: Controlplane & Transaction Management -->
  <g transform="translate(30, 326)">
    <rect class="layer-card" x="0" y="0" width="860" height="114" />
    <rect class="layer-accent-3" x="0" y="0" width="6" height="114" rx="3" />
    <text class="title" x="24" y="28">Controlplane &amp; Transaction Management</text>

    <rect class="pill" x="24" y="38" width="395" height="22" />
    <text class="item" x="36" y="53">Versioned Namespace &amp; Schema Descriptors</text>

    <rect class="pill" x="435" y="38" width="400" height="22" />
    <text class="item" x="447" y="53">Private Concurrency Control (PCC) &amp; Lock Table</text>

    <rect class="pill" x="24" y="64" width="395" height="22" />
    <text class="item" x="36" y="79">Certified Monotonic Clock (clock.Clock / GSTime)</text>

    <rect class="pill" x="435" y="64" width="400" height="22" />
    <text class="item" x="447" y="79">ReadFence Publication Barriers</text>

    <rect class="pill" x="24" y="90" width="395" height="18" />
    <text class="item" x="36" y="103">runSet (Resident File Handle Pins)</text>

    <rect class="pill" x="435" y="90" width="400" height="18" />
    <text class="item" x="447" y="103">Bounded Memory &amp; Spill Budget Manager</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <line class="arrow" x1="460" y1="440" x2="460" y2="472" marker-end="url(#arrowhead)" />
  <text class="edge-label" x="474" y="461">MutationBatch / ReadFence / OverlayView</text>

  <!-- Layer 4: NeoSepia Columnar Storage Engine -->
  <g transform="translate(30, 476)">
    <rect class="layer-card" x="0" y="0" width="860" height="120" />
    <rect class="layer-accent-4" x="0" y="0" width="6" height="120" rx="3" />
    <text class="title" x="24" y="28">NeoSepia Columnar Storage Engine</text>

    <rect class="pill" x="24" y="38" width="405" height="22" />
    <text class="item" x="34" y="53">Active Tier SSTs (c-&lt;tid&gt;-&lt;n&gt;.active.sst, L1..L7)</text>

    <rect class="pill" x="440" y="38" width="395" height="22" />
    <text class="item" x="450" y="53">Inactive Tier SSTs (c-&lt;tid&gt;-&lt;n&gt;.inactive.sst, MVCC)</text>

    <rect class="pill" x="24" y="64" width="405" height="22" />
    <text class="item" x="34" y="79">PAX v2 64KB Blocks (64B Header, 40B MVCC Records)</text>

    <rect class="pill" x="440" y="64" width="395" height="22" />
    <text class="item" x="450" y="79">No-Steal / Redo-Only WAL &amp; Out-of-Line Chunks</text>

    <rect class="pill" x="24" y="90" width="405" height="22" />
    <text class="item" x="34" y="105">Bounded Batch Budget (columnar.ErrBatchBudget)</text>

    <rect class="pill" x="440" y="90" width="395" height="22" />
    <text class="item" x="450" y="105">Generation Manifest (NSBASE03)</text>
  </g>
</svg>
