# Continuous integration for the SuperSQL repository.
#
# Actions are pinned to full commit SHAs because a tag can be moved; the
# trailing comment records the release tag each SHA was resolved from.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vet:
    name: build + vet
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go_setup
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' }}
        run: CGO_ENABLED=0 go build ./...
      - name: "Vet (accepted baseline: generated ragel scanner unreachable code)"
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' }}
        run: |
          set -eu
          go mod download
          findings="$(go vet ./... 2>&1 | grep -v '^#' | grep -v '^go: downloading ' | grep -v 'scan\.rl:[0-9]*: unreachable code$' || true)"
          if [ -n "$findings" ]; then
            printf '%s\n' "$findings"
            exit 1
          fi
      - name: Test
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' }}
        run: go test -short -count=1 ./...
      - name: licensecheck
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' }}
        run: go run ./internal/tools/licensecheck
      - name: docgen check
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' }}
        run: go run ./internal/tools/docgen -check
      - name: go generate + diff
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' }}
        run: |
          set -eu
          go generate ./internal/query/bind ./internal/query/builtin
          git diff --exit-code

  race:
    name: race detector
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with -race
        run: go test -race -count=1 ./internal/dataplane/... ./internal/controlplane/... ./clock/... ./pgx/... .

  govulncheck:
    name: govulncheck
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/govulncheck" ./...

  test-full:
    name: test (full)
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -count=1 ./...
      - name: Check every committed PostgreSQL 18.4 baseline
        env:
          NEOSEPIA_POSTGRES_REGRESS: "1"
          SUPERSQL_REGRESS_CORPORA: postgres184
        run: |
          set -euo pipefail
          baselines=(testdata/postgres184/baseline/*.txt)
          test -f "${baselines[0]}"
          selected=""
          for baseline in "${baselines[@]}"; do
            name="${baseline##*/}"
            name="${name%.txt}"
            selected="${selected:+$selected,}$name"
          done
          export SUPERSQL_REGRESS_FILES="$selected"
          go test -count=1 -timeout 10m -run '^TestPostgres18OfficialRegression$' -v .
          git diff --exit-code -- testdata/postgres184/baseline

  fuzz-smoke:
    name: fuzz smoke
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run all four bounded fuzz targets
        run: |
          status=0
          go test -run '^$' -fuzz '^FuzzEncodedBatchFraming$' -fuzztime 30s ./internal/dataplane/storage || status=$?
          go test -run '^$' -fuzz '^FuzzDecodeMutation$' -fuzztime 30s ./internal/dataplane/storage || status=$?
          go test -run '^$' -fuzz '^FuzzReverseMVCCVisibility$' -fuzztime 30s ./internal/dataplane/storage/neosepia || status=$?
          go test -run '^$' -fuzz '^FuzzPAXColumnDecoding$' -fuzztime 30s ./internal/dataplane/storage/neosepia || status=$?
          exit "$status"

  pg184-differential:
    name: postgres 18.4 differential
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SUPERSQL_PG184_DSN: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Differential gate
        run: go test -count=1 -timeout 0 -run '^TestPG184Differential$' -v .

  pg184-verdict:
    # Preserve the existing aggregate context. It requires the repository
    # gates, every committed corpus baseline, and the live differential check.
    # The exhaustive ordered corpus is an explicit manual workflow.
    name: postgres 18.4 differential + regression
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 10
    needs: [build-vet, race, test-full, pg184-differential]
    if: always()
    steps:
      - name: Aggregate required gates and pg184 verdict
        run: |
          build_vet="${{ needs['build-vet'].result }}"
          race="${{ needs.race.result }}"
          tests="${{ needs['test-full'].result }}"
          differential="${{ needs['pg184-differential'].result }}"
          printf 'build-vet=%s race=%s full-tests=%s differential=%s\n' "$build_vet" "$race" "$tests" "$differential"
          if [ "$build_vet" != success ] || [ "$race" != success ] || [ "$tests" != success ] || [ "$differential" != success ]; then
            echo 'Required gates or pg184 checks did not succeed.'
            exit 1
          fi
          echo 'Required repository gates, committed corpus baselines, and the pg184 differential passed.'
