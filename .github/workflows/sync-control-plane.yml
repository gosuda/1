name: sync-control-plane
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: land-suda-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          filter: blob:none
      - name: Synchronize control plane into refs/suda/main
        run: ./.github/scripts/sync-control-plane.sh
