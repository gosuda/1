name: Go

# Runs the Go tests against the engine binaries embedded in internal/embedded.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '7 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
            && '["depot-ubuntu-24.04","depot-ubuntu-24.04-arm","depot-macos-latest","depot-windows-2025"]'
            || '["depot-ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Go vet and tests
        shell: bash
        run: |
          GOWORK=off go vet ./...
          GOWORK=off go test -count=1 -timeout 15m ./...
