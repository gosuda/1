name: Engine

# Builds chrome_net_server from the pinned Chromium release (third_party/chromium) and runs the Go
# tests against the fresh binaries. Linux and Windows engines build in a gvx sandbox on Linux;
# macOS engines build natively. release.yml calls this workflow to produce release binaries.

on:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit or branch to build (default: the calling commit)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: engine-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux-host:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, linux-arm64, windows-amd64, windows-arm64]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Use the runner's scratch disk
        run: |
          sudo mkdir -p /mnt/chromenet-engine
          sudo chown "$(id -u):$(id -g)" /mnt/chromenet-engine
          df -h / /mnt
      - name: Cache the rungv release archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/chromenet-engine/rungv-*.tar.gz
          key: rungv-${{ hashFiles('scripts/engine/BUILDENV') }}
      - name: Build ${{ matrix.target }} in gvx
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/engine/build.sh -w /mnt/chromenet-engine -d dist ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-amd64]
    # GitHub-hosted macOS builds queue behind the shared pool while six
    # full engine rebuilds set an 89-minute wall; the Depot macOS runner
    # (Apple silicon) builds both Darwin targets with identical steps.
    runs-on: depot-macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.3'
          cache: true
      # The work directory holds the pinned source, toolchains and ninja
      # outputs; the scripts skip downloads and unchanged compiles when it
      # is warm. Keyed on every pinned input, per target, exact match only:
      # a stale revision must never be reused.
      - name: Cache the engine work directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chromenet-engine
          key: engine-work-darwin-${{ matrix.target }}-${{ hashFiles('third_party/chromium/VERSION', 'third_party/chromium/SHA256', 'third_party/chromium/patches/**', 'scripts/engine/BUILDENV', 'scripts/engine/*.py', 'scripts/engine/*.sh', 'go.mod', 'go.sum') }}
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Build ${{ matrix.target }}
        run: scripts/engine/build.sh -w "$RUNNER_TEMP/chromenet-engine" -d dist ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  test-linux-windows:
    name: test ${{ matrix.target }}
    needs: [build-linux-host]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: depot-ubuntu-24.04
          - target: linux-arm64
            runner: depot-ubuntu-24.04-arm
          - target: windows-amd64
            runner: depot-windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-${{ matrix.target }}
          path: dist
      - name: Go tests against the fresh engine
        shell: bash
        run: |
          set -euo pipefail
          bin=$(ls "$PWD"/dist/chrome_net_server_*)
          chmod +x "$bin"
          HQQ_CHROME_NET_SERVER="$bin" GOWORK=off go test -count=1 -timeout 15m ./...

  test-macos:
    name: test ${{ matrix.target }}
    needs: [build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: depot-macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-${{ matrix.target }}
          path: dist
      - name: Go tests against the fresh engine
        shell: bash
        run: |
          set -euo pipefail
          bin=$(ls "$PWD"/dist/chrome_net_server_*)
          chmod +x "$bin"
          HQQ_CHROME_NET_SERVER="$bin" GOWORK=off go test -count=1 -timeout 15m ./...
