name: SQLite CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
            && '[{"name":"Linux amd64 (clang-18)","os":"depot-ubuntu-24.04","cc":"clang-18"},{"name":"Linux arm64 (gcc-13)","os":"depot-ubuntu-24.04-arm","cc":"gcc-13"},{"name":"macOS arm64 (clang)","os":"depot-macos-latest","cc":"clang"}]'
            || '[{"name":"Linux amd64 (clang-18)","os":"depot-ubuntu-24.04","cc":"clang-18"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Checkout HQQ core
        run: git clone --depth 1 https://github.com/gosuda/HQQ.git ../HQQ
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Install Ninja
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake clang-18 gcc-13
          else
            command -v ninja >/dev/null || brew install ninja
          fi
      - name: Print toolchain versions
        run: |
          go version
          "$CC" --version
          cmake --version
      - name: Run C unit tests
        run: |
          adir=$(scripts/release/fetch-sqlite.sh)
          cmake -S sqlite3/server -B "${RUNNER_TEMP}/c-unit-build" -G Ninja \
            -DHQQ_SQLITE_AMALGAMATION_DIR="$adir" \
            -DSQLSRV_BUILD_TESTS=ON
          cmake --build "${RUNNER_TEMP}/c-unit-build" --target hqqsqlite_server_unit_tests
          ctest --test-dir "${RUNNER_TEMP}/c-unit-build" --output-on-failure
      - name: Build hqq-sqlite-server and run Go tests
        run: |
          eval "$(sqlite3/build.sh -T)"
          go vet ./...
          go test -count=1 -p 1 -v -race -timeout 10m ./...
