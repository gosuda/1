name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Linux (Clang 18)
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout HQQ core
        shell: bash
        run: git clone --depth 1 https://github.com/gosuda/HQQ.git ../HQQ

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Restore cached Zstandard source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hqq-zstd
          key: zstd-src-${{ hashFiles('third_party/zstd/VERSION', 'third_party/zstd/SHA256') }}

      - name: Install C build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 cmake ninja-build

      - name: Run release script unit tests
        shell: bash
        run: |
          py=python3
          if ! command -v python3 >/dev/null 2>&1 || ! python3 --version >/dev/null 2>&1; then
            py=python
          fi
          "$py" -m unittest scripts/release/test_zstd_release.py -v

      - name: Build zstd_server and run Go tests
        env:
          CC: clang-18
        run: |
          set -euo pipefail
          "$CC" --version
          go vet ./...
          eval "$(TMPDIR="$HOME/.cache/hqq-zstd/tmp" ./build.sh -b "$RUNNER_TEMP/hqq-zstd-build")"
          go test -short -v -race -count=1 -timeout 10m -tags zstdcgo ./...
